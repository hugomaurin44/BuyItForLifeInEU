<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIFL Guide Europe</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:opsz,wght@8..144,400;8..144,700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body> <header>
        <nav>
            <span class="logo">🇪🇺 BIFL Guide</span>
            <div class="controls">
                <select id="lang-select" onchange="setLanguage(this.value)">
                    <option value="fr">🇫🇷 Français</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="de">🇩🇪 Deutsch</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="pl">🇵🇱 Polski</option>
                    <option value="ru">🇷🇺 Русский</option>
                    <option value="uk">🇺🇦 Українська</option>
                    <option value="ro">🇷🇴 Română</option>
                    <option value="nl">🇳🇱 Nederlands</option>
                </select>
                <button id="theme-toggle" onclick="toggleTheme()">🌓</button>
            </div>
        </nav>
    </header>

    <main id="content">
        <p>Chargement du guide...</p>
    </main>

    <script>
        const supportedLangs = ['fr', 'en', 'de', 'ru', 'it', 'es', 'pl', 'uk', 'ro', 'nl'];

        async function loadContent(lang) {
            const container = document.getElementById('content');
            const select = document.getElementById('lang-select');
            select.value = lang;

            const filePath = (lang === 'fr') ? `BIFL_FR.md` : `content/BIFL_${lang.toUpperCase()}.md`;

            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error('File not found');
                const text = await response.text();
                container.innerHTML = marked.parse(text);
                window.location.hash = lang;
            } catch (err) {
                container.innerHTML = `<p>Erreur : Impossible de charger la langue ${lang}.</p>`;
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('dark-mode');
            // On bascule entre les classes light et dark
            if (isDark) {
                document.body.classList.remove('dark-mode');
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
            }
        }

        function setLanguage(lang) { loadContent(lang); }

        function init() {
            // 1. Thème
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.body.classList.add(savedTheme + '-mode');
            }
            
            // 2. Langue
            let currentLang = window.location.hash.replace('#', '').toLowerCase();
            if (!supportedLangs.includes(currentLang)) {
                const browserLang = navigator.language.split('-')[0];
                currentLang = supportedLangs.includes(browserLang) ? browserLang : 'fr';
            }
            loadContent(currentLang);
        }

        window.onload = init;
    </script>
</body>
</html>
