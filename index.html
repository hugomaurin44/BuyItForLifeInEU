<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyItForLife Europe Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:opsz,wght@8..144,400;8..144,700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
</head>
<body> 

    <header>
        <nav>
            <span class="logo">🇪🇺 BuyItForLife Guide</span>
            <div class="controls">
                <select id="lang-select" onchange="setLanguage(this.value)">
                    <option value="fr">🇫🇷 Français</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="de">🇩🇪 Deutsch</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="pl">🇵🇱 Polski</option>
                    <option value="ru">🇷🇺 Русский</option>
                    <option value="uk">🇺🇦 Українська</option>
                    <option value="ro">🇷🇴 Română</option>
                    <option value="nl">🇳🇱 Nederlands</option>
                </select>
                <button id="theme-toggle" onclick="toggleTheme()">🌓</button>
            </div>
        </nav>
    </header>

    <main id="content">
        <p>Chargement du guide...</p>
    </main>

    <footer>
        <p>
            made by <a href="https://github.com/hugomaurin44" target="_blank">Hugo Maurin</a> 
            using <a href="https://claude.ai" target="_blank">Claude AI</a> 
            and <a href="https://gemini.google.com" target="_blank">Gemini</a> - 
            <a href="https://www.apache.org/licenses/LICENSE-2.0.html" target="_blank">Apache 2.0</a>
        </p>
    </footer>

    <script>
        const supportedLangs = ['fr', 'en', 'de', 'ru', 'it', 'es', 'pl', 'uk', 'ro', 'nl'];

        async function loadContent(lang) {
            const container = document.getElementById('content');
            const select = document.getElementById('lang-select');
            select.value = lang;

            // ATTENTION : Ici aussi on utilise l'espace pour le fichier FR
            const filePath = (lang === 'fr') ? `BIFL_FR.md` : `content/BIFL_${lang.toUpperCase()}.md`;

            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error('File not found');
                const text = await response.text();
                container.innerHTML = marked.parse(text);
                twemoji.parse(document.body, { folder: 'svg', ext: '.svg' });
                window.location.hash = lang;
            } catch (err) {
                container.innerHTML = `<p>Erreur : Impossible de charger la langue ${lang}.</p>`;
            }
        }

        function toggleTheme() {
            const b = document.body;
            if (b.classList.contains('dark-mode')) {
                b.classList.replace('dark-mode', 'light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                b.classList.remove('light-mode');
                b.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
            }
        }

        function setLanguage(lang) { loadContent(lang); }

        function init() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) document.body.classList.add(savedTheme + '-mode');
            
            let currentLang = window.location.hash.replace('#', '').toLowerCase();
            if (!supportedLangs.includes(currentLang)) {
                currentLang = supportedLangs.includes(navigator.language.split('-')[0]) ? navigator.language.split('-')[0] : 'fr';
            }
            loadContent(currentLang);
        }
        window.onload = init;
    </script>
</body>
</html>
